<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>FSDB Editor</title>
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
                background: #111;
                color: #eee;
            }

            .controls {
                padding: 8px 10px;
                border-bottom: 1px solid #333;
                background: #161616;
                display: flex;
                align-items: center;
                gap: 14px;
                flex-wrap: wrap;
            }

            .picker-group {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .picker-label {
                font-size: 12px;
                color: #888;
                white-space: nowrap;
            }

            .seg-row {
                display: flex;
                gap: 3px;
            }

            .btn-danger { border-color: #733; color: #f99; }
            .btn-danger:hover { background: #3a1a1a; }

            .seg-btn {
                font-size: 12px;
                padding: 4px 9px;
                border-radius: 5px;
                border: 1px solid #444;
                background: #1e1e1e;
                color: #ccc;
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.1s;
            }

            .seg-btn:hover { background: #2a2a2a; }

            .seg-btn.active {
                background: #1a3a5c;
                color: #7ab8f5;
                border-color: #2a5a8c;
                font-weight: 600;
            }

            .date-input {
                width: 72px;
                font-size: 12px;
                font-family: monospace;
                padding: 4px 8px;
                border-radius: 5px;
                border: 1px solid #444;
                background: #1e1e1e;
                color: #eee;
                outline: none;
            }

            .date-input:focus { border-color: #666; }

            .date-input.active {
                background: #1a3a5c;
                color: #7ab8f5;
                border-color: #2a5a8c;
                font-weight: 600;
            }

            .date-input.invalid { border-color: #a33; }

            .playlist-display {
                font-family: monospace;
                font-size: 13px;
                color: #777;
                padding: 4px 8px;
                border: 1px solid #333;
                border-radius: 5px;
                background: #1a1a1a;
            }

            .playlist-display span {
                color: #eee;
                font-weight: 600;
            }

            .btn {
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 5px;
                border: 1px solid #444;
                background: #222;
                color: #eee;
                cursor: pointer;
            }

            .btn:hover { background: #333; }

            .container {
                display: flex;
                height: calc(100vh - 52px);
            }

            .panel {
                flex: 1;
                padding: 10px;
                box-sizing: border-box;
                overflow-y: auto;
                border-right: 1px solid #333;
            }

            .panel:last-child { border-right: none; }

            h2 {
                margin-top: 0;
                font-size: 13px;
                color: #777;
                font-weight: 500;
            }

            .item {
                padding: 5px 7px;
                margin: 2px 0;
                cursor: pointer;
                border-radius: 4px;
                font-size: 13px;
            }

            .item:hover { background: #1e1e1e; }
            .dir { color: #6cf; }
            .file { color: #ccc; }
        </style>
    </head>
    <body>
        <div class="controls">
            <div class="picker-group">
                <span class="picker-label">Day</span>
                <div class="seg-row" id="dayPicker"></div>
            </div>
            <div class="picker-group">
                <span class="picker-label">Date</span>
                <input type="text" id="dateInput" class="date-input" placeholder="oct/18"
                    maxlength="8" autocomplete="off" spellcheck="false"
                    title="mon/DD, e.g. oct/18 (also accepts 10/18 or oct 18)">
                <button class="btn btn-danger" id="removeDateBtn" onclick="removeDate()" style="display:none">Remove date</button>
            </div>
            <div class="picker-group">
                <span class="picker-label">Part</span>
                <div class="seg-row" id="partPicker"></div>
            </div>
            <div class="playlist-display">playlist: <span id="playlistVal">friday/day</span></div>
            <button class="btn" onclick="refreshPlaylist()">Refresh</button>
            <button class="btn" onclick="reloadPlaylist()">Reload on Player</button>
        </div>

        <div class="container">
            <div class="panel">
                <h2>Ref Dir</h2>
                <div id="ref"></div>
            </div>
            <div class="panel">
                <h2>Playlist</h2>
                <div id="playlistView"></div>
            </div>
        </div>

        <script src="/ws.js"></script>
        <script>
            const DAYS = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
            const PARTS = ["day","morning","night","late_night"];

            const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
            const MONTH_DAYS = [31,29,31,30,31,30,31,31,30,31,30,31];

            let selectedDay = "friday";
            let selectedDate = null;   // e.g. "oct/18"; when set, it overrides the weekday
            let selectedPart = "day";

            const dateInput = document.getElementById("dateInput");

            // Accepts "oct/18", "oct 18", "oct-18", "10/18", "10.18", "oct/5" -> "oct/05"
            function parseDate(str) {
                const m = str.trim().toLowerCase().match(/^([a-z]{3}|\d{1,2})\s*[\/\-. ]\s*(\d{1,2})$/);
                if (!m) return null;

                let monthIdx;
                if (/^\d+$/.test(m[1])) monthIdx = parseInt(m[1], 10) - 1;
                else monthIdx = MONTHS.indexOf(m[1]);

                const day = parseInt(m[2], 10);
                if (monthIdx < 0 || monthIdx > 11) return null;
                if (day < 1 || day > MONTH_DAYS[monthIdx]) return null;

                return MONTHS[monthIdx] + "/" + String(day).padStart(2, "0");
            }

            function buildPicker(containerId, items, getCurrent, setCurrent) {
                const el = document.getElementById(containerId);
                el.innerHTML = "";
                items.forEach(val => {
                    const btn = document.createElement("button");
                    btn.className = "seg-btn" + (getCurrent() === val ? " active" : "");
                    btn.textContent = val.replace("_", " ");
                    btn.onclick = () => {
                        setCurrent(val);
                        buildPickers();
                        updateDisplay();
                        refreshPlaylist();
                    };
                    el.appendChild(btn);
                });
            }

            function removeDate() {
                if (!selectedDate) return;
                if (!confirm("Delete " + selectedDate + " and ALL its playlists?\nThis day will fall back to the weekday playlists.")) return;
                WS.send({ action: "fsdb_remove_date", date: selectedDate });
            }

            WS.on("state", d => renderRef(d.dirs));
            WS.on("fsdb_list", renderPlaylist);
            WS.on("fsdb_remove_date", (_, m) => m.error ? alert("Could not remove date: " + m.error) : clearDate());
            WS.on("_status", s => { if (s === "open") refreshPlaylist(); });

            function clearDate() {
                selectedDate = null;
                dateInput.value = "";
                dateInput.classList.remove("active", "invalid");
                buildPickers();
                updateDisplay();
                refreshPlaylist();
            }

            function buildPickers() {
                buildPicker("dayPicker", DAYS,
                    () => selectedDate ? null : selectedDay,
                    v => {
                        selectedDay = v;
                        selectedDate = null;
                        dateInput.value = "";
                        dateInput.classList.remove("active", "invalid");
                    });
                buildPicker("partPicker", PARTS, () => selectedPart, v => { selectedPart = v; });
                document.getElementById("removeDateBtn").style.display = selectedDate ? "" : "none";
            }

            function getPlaylistName() {
                return (selectedDate || selectedDay) + "/" + selectedPart;
            }

            function updateDisplay() {
                document.getElementById("playlistVal").textContent = getPlaylistName();
            }

            // "change" fires on Enter or when the field loses focus
            dateInput.addEventListener("change", () => {
                const raw = dateInput.value.trim();

                if (raw === "") {
                    selectedDate = null;
                    dateInput.classList.remove("active", "invalid");
                } else {
                    const parsed = parseDate(raw);
                    if (!parsed) {
                        dateInput.classList.add("invalid");
                        return; // keep the previous selection
                    }
                    selectedDate = parsed;
                    dateInput.value = parsed; // normalize, e.g. "10/5" -> "oct/05"
                    dateInput.classList.remove("invalid");
                    dateInput.classList.add("active");
                }

                buildPickers();
                updateDisplay();
                refreshPlaylist();
            });

            buildPickers();

            function sortNames(items) {
                return [...items].sort((a, b) =>
                    a.localeCompare(b, undefined, { sensitivity: "base" })
                );
            }

            function renderRef(data) {
                const el = document.getElementById("ref");
                el.innerHTML = "";

                sortNames(data.dirs).forEach(d => {
                    const div = document.createElement("div");
                    div.className = "item dir";
                    div.textContent = d + "/";
                    div.onclick = () => addDir(d);
                    el.appendChild(div);
                });

                sortNames(data.files).forEach(f => {
                    const div = document.createElement("div");
                    div.className = "item file";
                    div.textContent = f;
                    div.onclick = () => addFile(f);
                    el.appendChild(div);
                });
            }

            function renderPlaylist(data) {
                data = data || {};
                data.dirs = data.dirs || [];
                data.files = data.files || [];

                const el = document.getElementById("playlistView");
                el.innerHTML = "";

                sortNames(data.dirs).forEach(d => {
                    const div = document.createElement("div");
                    div.className = "item dir";
                    div.textContent = d + "/";
                    div.onclick = () => removeEntry(d);
                    el.appendChild(div);
                });

                sortNames(data.files).forEach(f => {
                    const div = document.createElement("div");
                    div.className = "item file";
                    div.textContent = f;
                    div.onclick = () => removeEntry(f);
                    el.appendChild(div);
                });
            }

            function addFile(name) {
                WS.send({ action: "fsdb_add", name, playlist: getPlaylistName() });
                setTimeout(refreshPlaylist, 100);
            }

            function addDir(name) {
                WS.send({ action: "fsdb_add_dir", name, playlist: getPlaylistName() });
                setTimeout(refreshPlaylist, 100);
            }

            function removeEntry(name) {
                if (!confirm("Remove " + name + "?")) return;
                WS.send({ action: "fsdb_remove", name, playlist: getPlaylistName() });
                setTimeout(refreshPlaylist, 100);
            }

            function refreshPlaylist() {
                WS.send({ action: "fsdb_list", playlist: getPlaylistName() });
            }

            function reloadPlaylist() {
                WS.send({ action: "fsdb_add", name: "reload" });
            }
        </script>
    </body>
</html>
